name: Git to Notion Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    # 현재 만들어 둔 GitHub Environment 이름
    environment: NOTION_TOKEN

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tracker
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python tracker.py