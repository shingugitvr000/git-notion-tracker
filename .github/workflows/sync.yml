name: Git Commit Archive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose a one-time full history backfill or the normal incremental sync."
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - backfill
      force_backfill:
        description: "Allow another complete backfill after one has already finished."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: git-commit-archive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build commit archive
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'incremental' }}
          FORCE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_backfill || 'false' }}
        run: python tracker.py

      - name: Commit archive changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- commits.json archive-meta.json
          git diff --cached --quiet || git commit -m "Update commit archive"
          git push